name: Validate and publish Nymind EDITION preview
on:
  push:
    branches:
      - nova-preview
    paths:
      - package.json
      - nova/**
      - .github/workflows/nova-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate standalone module and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check nova/app.js
          node -e "const p=require('./package.json'); if(p.version!=='0.2.0'||p.appPath!=='nova/index.html'||p.appName!=='Nymind EDITION (TEST)'||p.packageType!=='app')process.exit(1)"
          python3 - <<'PY'
          from pathlib import Path
          html=Path('nova/index.html').read_text()
          css=Path('nova/style.css').read_text()
          js=Path('nova/app.js').read_text()
          for name in ['screen','gallery','overlay','options','radio-player','clock','weather','selected-hint']:
              assert f'id="{name}"' in html, name
          assert '<script src="app.js?v=020"></script>' in html
          assert '<link rel="stylesheet" href="style.css?v=020">' in html
          assert html.count('<script')==html.count('</script>')==1
          assert 'function runModule(mod)' in js
          assert 'ColorF0Red' in js and 'ColorF1Green' in js
          assert '#screen' in css and '.poster.selected' in css
          assert '.theme-noir .poster-cinema' in css
          assert 'Cormorant' in css
          assert 'function runModule(mod)' in js
          for art in ['cinema','live','tube','radio','play']:
              svg=Path(f'nova/art-{art}.svg')
              assert svg.is_file() and '<svg' in svg.read_text(), art
          assert Path('nova/style.css').stat().st_size > 8000
          print('NOVA module and UI validated.')
          PY
      - name: Render EDITION 1920x1080 preview
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if test -z "$CHROME"; then echo "Chrome unavailable for screenshot, syntax passed"; exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1920,1080 --virtual-time-budget=3000 --screenshot="$PWD/edition-preview.png" "file://$PWD/nova/index.html"
          test -s edition-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edition-preview-1920x1080
          path: edition-preview.png
          if-no-files-found: ignore
      - name: Refresh EDITION preview CDN
        shell: bash
        run: |
          for FILE in package.json nova/index.html nova/style.css nova/app.js nova/art-cinema.svg nova/art-live.svg nova/art-tube.svg nova/art-radio.svg nova/art-play.svg; do
            curl --max-time 15 -fsSL "https://purge.jsdelivr.net/gh/romangazdik-web/nyminds-tv@nova-preview/${FILE}" || true
          done
