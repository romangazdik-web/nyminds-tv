name: Publish Nymind TV
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish-nymind-tv.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nymind-tv-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'romangazdik-web/nyminds-tv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate self-contained CINEMATIC and direct title links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, subprocess
          p=json.loads(Path('package.json').read_text())
          assert p['version']=='6.0.0',p['version']
          assert p['packageType']=='app'
          assert p['appPath']=='cinematic/index.html'
          assert p['name']=='nyminds-tv'
          assert 'cinematic/' in p['files']
          h=Path('cinematic/index.html').read_text()
          assert '<title>Nymind OS 6.0 · CINEMATIC</title>' in h
          assert '<style id="cinematic-inline-core">' in h
          assert '<script id="cinematic-inline-controller">' in h
          assert 'data:image/jpeg;base64,' in h
          assert '<script src=' not in h
          assert '<link rel="stylesheet"' not in h
          assert 'function launchInstalled(mod,target)' in h
          assert 'function refreshRecommendations(force)' in h
          assert 'function openMovie(m)' in h
          assert "nymind_id=" in h and "nymind_type=" in h
          assert "images.metahub.space/background/large/tt15239678/img" in h
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script\s*>',h,re.S|re.I)
          assert len(scripts)==1, f'Single inline controller expected, got {len(scripts)}'
          for n,code in enumerate(scripts):
              file=Path('/tmp/nymind-6-script-%d.js'%n)
              file.write_text(code)
              subprocess.run(['node','--check',str(file)],check=True)
          legacy=Path('app/index.html').read_text()
          assert 'cinematic/index.html' in legacy
          print('Validated Nymind OS 6.0, TV inline assets, catalog rotation and IMDb title handoff.')
          PY
      - name: Render CINEMATIC 1920x1080 regression screenshot
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1920,1080 --virtual-time-budget=3000 --screenshot="$PWD/nymind-os-6.0.png" "file://$PWD/cinematic/index.html" >/tmp/nymind6-chrome.log 2>&1 || { tail -n 60 /tmp/nymind6-chrome.log; exit 1; }
          test -s nymind-os-6.0.png
      - uses: actions/upload-artifact@v4
        with:
          name: nymind-os-6-full-hd
          path: nymind-os-6.0.png
          if-no-files-found: error
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "Publishing ${TAG} from ${GITHUB_SHA}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "Nymind TV ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "Nymind OS ${TAG} • CINEMATIC" --notes "Main launcher switched to CINEMATIC TV: HD Dune fanart, four rotating Cinemeta recommendations, direct IMDb title handoff to Nymind Cinema 2.5.26, and TV-safe inlined CSS/JS. Original v5.0 tag remains available for rollback."
          fi
      - name: Purge stable launcher CDN and legacy redirect
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          for REV in "" "@main" "@latest" "@v$VERSION"; do
            for FILE in package.json cinematic/index.html app/index.html; do
              URL="https://purge.jsdelivr.net/gh/romangazdik-web/nyminds-tv$REV/$FILE"
              echo "$URL"
              curl --max-time 15 -fsSL "$URL" || echo "Purge may be rate-limited: $URL"
              echo
            done
          done
          echo "Nymind OS 6.0 stable launcher CDN purge finished."
