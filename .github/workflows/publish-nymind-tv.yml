name: Publish Nymind TV
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish-nymind-tv.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nymind-tv-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'romangazdik-web/nyminds-tv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate inlined Living Home CSS and all inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check app/ambient-home.js
          node --check app/app.js
          python3 - <<'PY'
          import pathlib, re, subprocess
          h=pathlib.Path('app/index.html').read_text()
          assert '<style id="nymind-os-v401-core">' in h
          assert '<script id="nymind-os-v401-ambient">' in h
          assert '<main id="os5-root">' in h
          assert '<section id="nsp-spaces"' in h
          assert '<style id="nsp-spaces-styles">' in h
          assert '<script id="nsp-spaces-controller">' in h
          assert 'function atlasToggle(on)' in h
          assert 'function setScene(idx)' in h
          assert '<style id="os5-horizon-css">' in h
          assert '<script id="nymind-global-switcher">' in h
          assert 'window.NYMIND_FEATURE_UPDATE' in h
          assert "parseFromString('<body>'+match[1]+'</body>'" in h
          assert '<script src="ambient-home.js?v=4.0.0">' not in h
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script\s*>',h,re.S|re.I)
          assert len(scripts)>=4, f'Expected inlined scripts, got {len(scripts)}'
          for n,source in enumerate(scripts):
              path=f'/tmp/nymind-inline-{n}.js'
              pathlib.Path(path).write_text(source)
              subprocess.run(['node','--check',path],check=True)
          print('Validated',len(scripts),'inline scripts')
          PY
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "Publishing ${TAG} from ${GITHUB_SHA}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "Nymind TV ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "Nymind TV ${TAG}" --notes "Nymind OS 5.0 SPACES: five immersive fullscreen worlds for Cinema, Live TV, YouTube, Radio and PS5. Horizontal world navigation and a full-screen Atlas; preserves existing TizenBrew launch logic, shared app switching and seasonal weather themes. ES5 compatible."
          fi
      - name: Purge jsDelivr launcher files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          for REV in "" "@main" "@latest" "@v${VERSION}"; do
            for FILE in package.json app/index.html app/app.js app/ambient-home.css app/ambient-home.js app/switcher.js; do
              URL="https://purge.jsdelivr.net/gh/romangazdik-web/nyminds-tv${REV}/${FILE}"
              echo "${URL}"
              curl --max-time 15 -fsSL "${URL}" || echo "CDN purge may be rate-limited: ${URL}"
              echo
            done
          done
          echo "Nymind TV launcher purge finished."
          # The live IPTV module is unchanged, but clear its manifest and entrypoint
          # so neither old @main nor latest CDN metadata masks the installed module.
          for REV in "" "@main" "@latest" "@v1.3.1"; do
            for FILE in package.json app/tv09.html; do
              URL="https://purge.jsdelivr.net/gh/romangazdik-web/tvpin${REV}/${FILE}"
              echo "${URL}"
              curl --max-time 15 -fsSL "${URL}" || echo "IPTV CDN purge rate-limited: ${URL}"
              echo
            done
          done
          echo "Nymind TV and IPTV CDN purge finished."
