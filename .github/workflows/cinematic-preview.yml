name: Validate Nymind CINEMATIC TV Edition
on:
  push:
    branches: [cinematic-faithful]
    paths:
      - package.json
      - cinematic/**
      - .github/workflows/cinematic-preview.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinematic-faithful-tv
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Embed approved local photography into self-contained HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('cinematic/index.html')
          s=p.read_text()
          photo='https://cdn.jsdelivr.net/gh/romangazdik-web/nyminds-tv@cinematic-faithful/cinematic/hero-approved.jpg'
          if photo in s:
              payload=base64.b64encode(Path('cinematic/hero-approved.jpg').read_bytes()).decode('ascii')
              s=s.replace(photo,'data:image/jpeg;base64,'+payload)
              p.write_text(s)
              print('Embedded user-approved hero image in HTML (no runtime image dependency)')
          else:
              print('Approved hero already embedded')
          PY
          if ! git diff --quiet -- cinematic/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cinematic/index.html
            git commit -m "Embed approved hero bytes directly in Tizen HTML [skip ci]"
            git push origin "HEAD:cinematic-faithful"
          fi
      - name: Validate Tizen-compatible inline UI and original module identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          p=json.loads(Path('package.json').read_text())
          assert p['version']=='1.1.2' and p['packageType']=='app'
          assert p['appName']=='Nymind CINEMATIC TV (TEST)'
          assert p['appPath']=='cinematic/index.html'
          h=Path('cinematic/index.html').read_text()
          assert '<style id="cinematic-inline-core">' in h
          assert '<script id="cinematic-inline-controller">' in h
          assert 'data:image/jpeg;base64,' in h
          assert '<div id="hero-art"></div>' in h
          assert '<link rel="stylesheet"' not in h
          assert '<script src=' not in h
          assert 'function launchInstalled(mod,target)' in h
          assert 'function refreshRecommendations(force)' in h
          assert 'function openMovie(m)' in h
          assert 'nymind_id=' in h
          assert 'function fetchCatalog(type,done)' in h
          assert '1920px;height:1080px' in h
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script\s*>',h,re.I|re.S)
          assert len(scripts)==1, f'Expected one standalone inline script, found {len(scripts)}'
          for i,s in enumerate(scripts):
              tmp=Path(f'/tmp/cinematic-script-{i}.js')
              tmp.write_text(s)
              subprocess.run(['node','--check',str(tmp)],check=True)
          assert len(re.findall(r'<style\b',h,re.I))==1
          print('Inline CSS, JS, user-approved image and Tizen structure verified')
          PY
      - name: Check live Cinemeta catalogs and HD movie background
        shell: bash
        run: |
          set +e
          curl -fLsS --max-time 15 "https://v3-cinemeta.strem.io/catalog/movie/top.json" -o /tmp/cinemeta-movies.json
          if test -s /tmp/cinemeta-movies.json; then
            python3 - <<'PY'
          import json
          try:
              x=json.load(open('/tmp/cinemeta-movies.json'))
              metas=x.get('metas',[])
              print("CINEMETA Movies:",len(metas),"examples:",[(m.get('name'),m.get('id')) for m in metas[:3]])
          except Exception as e: print("CINEMETA movies parse failed:",e)
          PY
          fi
          curl -fLsS --max-time 18 "https://images.metahub.space/background/large/tt15239678/img" -o /tmp/nymind-dune-hd.jpg
          if test -s /tmp/nymind-dune-hd.jpg; then
            ls -lh /tmp/nymind-dune-hd.jpg
            file /tmp/nymind-dune-hd.jpg
          else
            echo "Background server unreachable: launcher will use embedded fallback."
          fi
          exit 0
      - name: Render full HD offline-like preview
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --hide-scrollbars --window-size=1920,1080 --virtual-time-budget=3000 --screenshot="$PWD/cinematic-tv-1.1.2.png" "file://$PWD/cinematic/index.html" >/tmp/cinematic-tv-chrome.log 2>&1 || { tail -n 60 /tmp/cinematic-tv-chrome.log; exit 1; }
          test -s cinematic-tv-1.1.2.png
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-tv-1.1.2-screenshot
          path: cinematic-tv-1.1.2.png
          if-no-files-found: error
      - name: Purge only the isolated TV test branch
        shell: bash
        run: |
          for FILE in package.json cinematic/index.html cinematic/hero-approved.jpg; do
            curl --max-time 15 -fsSL "https://purge.jsdelivr.net/gh/romangazdik-web/nyminds-tv@cinematic-faithful/${FILE}" || echo "Purge rate limited: ${FILE}"
          done
