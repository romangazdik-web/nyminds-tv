<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nymind TV – Monochrome Edition</title>
<!-- NYMIND TV MONOCHROME 1.3: weather-aware cinematic wallpapers; self-contained, ES5/Tizen3 -->
<style type="text/css">
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:'Segoe UI',Arial,Helvetica,sans-serif}
/* Always render an actual visible screen, even when Tizen reports unreliable dimensions. */
#stage{position:fixed!important;left:0!important;top:0!important;width:100%!important;height:100%!important;display:block!important;visibility:visible!important;opacity:1!important;-webkit-transform:none!important;transform:none!important;background:#17212d!important;overflow:hidden;z-index:1}
.wallpaper{position:absolute;left:0;top:0;width:100%;height:100%;background-position:center;background-size:cover;background-repeat:no-repeat;background-image:url('wallpapers/wallpaper-20.jpg')}
.wallpaper-next{opacity:0;-webkit-transition:opacity 1.35s ease;transition:opacity 1.35s ease;pointer-events:none}
/* Weather tint is very light and has no effect on controls or text. */
.weather-tint{position:absolute;left:0;top:0;width:100%;height:100%;background-color:#7295b1;opacity:0;pointer-events:none;-webkit-transition:opacity 2s ease,background-color 2s ease;transition:opacity 2s ease,background-color 2s ease}
.scrim{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg,rgba(8,14,23,.90) 0%,rgba(9,15,23,.71) 43%,rgba(11,15,24,.24) 100%),linear-gradient(0deg,rgba(5,9,17,.82),transparent 58%);pointer-events:none}
.topbar{position:absolute;left:6%;top:7%;right:6%;height:80px;z-index:4}
.brand{position:absolute;left:0;top:0;height:78px;white-space:nowrap}
.brand-symbol{display:inline-block;width:73px;height:73px;vertical-align:middle;margin-right:20px}
.brand-emblem{display:block;width:73px;height:73px}
.brand-name{display:inline-block;vertical-align:middle;font-size:35px;line-height:73px;font-weight:bold;letter-spacing:-1.3px;color:#f7f8f8}
.brand-name .brand-tv{color:#d4d9de;font-size:24px;font-weight:normal;letter-spacing:1.5px;vertical-align:baseline}
.now{position:absolute;right:0;top:0;text-align:right;white-space:nowrap}
/* 1.3: time and date slightly larger, weather clearly subordinate. */
.datetime strong{display:block;font-weight:normal;font-size:58px;line-height:1.08;color:#fff;letter-spacing:-2px}
.datetime #date{font-size:20px;color:#e0e5e8;margin-top:7px;line-height:1.2}
/* Weather stays hidden until a successful API response. */
.weather{display:none;white-space:nowrap;margin-top:14px;color:#d9e0e6;line-height:1.25}
.weather-icon{display:inline-block;vertical-align:middle;font-size:19px;margin-right:7px;line-height:1}
.weather-current{display:inline-block;vertical-align:middle;font-size:15px;letter-spacing:.1px}
.weather-current strong{font-size:16px;font-weight:600;color:#eef2f4}
.weather-place{font-size:12px;letter-spacing:.2px;color:#c7cfd7;margin-top:4px}
.weather-source{font-size:9px;margin-top:2px;color:#aab4bf;opacity:.78}
.weather-source a{color:#aab4bf;text-decoration:none}

main{position:absolute;left:6%;top:32%;right:6%;bottom:7%;z-index:3}
.intro-area{margin:0 0 8vh 0}
.eyebrow{color:#c5ccd5;font-size:14px;letter-spacing:4px;font-weight:bold;margin-bottom:25px}
.eyebrow-line{display:inline-block;width:45px;height:1px;background:#e0e2e5;vertical-align:middle;margin-right:15px}
h1{margin:0;font-size:83px;line-height:1.13;font-weight:600;letter-spacing:-3px;color:#fff;text-shadow:0 6px 25px #111}
.subtitle{font-size:25px;color:#d8dce1;line-height:1.3;margin:15px 0 0}
.dock-area{position:relative}
.dock-label{font-size:13px;letter-spacing:3px;color:#cdd2d7;font-weight:bold;margin-bottom:18px}
.tiles{display:block;white-space:nowrap}
.tile{display:inline-block;position:relative;vertical-align:top;width:170px;margin-right:32px;text-align:center;outline:0;cursor:pointer;color:#fff}
.tile-face{display:block;position:relative;width:166px;height:163px;border-radius:28px;border:2px solid rgba(255,255,255,.38);background:rgba(30,37,45,.77);box-shadow:0 15px 28px rgba(0,0,0,.25)}
.tile.active .tile-face,.tile:focus .tile-face{border:3px solid #fff;background:rgba(92,97,103,.79);box-shadow:0 0 0 5px rgba(255,255,255,.14),0 16px 38px #060b11}
.app-icon{position:absolute;left:41px;top:40px;width:80px;height:80px;color:#fff;fill:none}
.tile-copy{display:block}.tile-copy strong{display:block;font-size:20px;font-weight:bold;margin-top:14px}.tile-copy small{display:block;font-size:13px;margin-top:5px;color:#bec5ce}
.background-label{position:absolute;right:6%;bottom:6%;text-align:right;color:#e1e5ea;z-index:3;font-size:13px}
.background-label strong{display:block;letter-spacing:3px;font-size:12px}.background-label span{display:block;color:#c9d0d7;margin-top:7px}
.screenreader-only{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important}
.overlay{position:fixed;left:0;top:0;width:100%;height:100%;z-index:50;display:block;background:#0a111a;color:#fff}
.hidden{display:none!important}
.modal{position:absolute;left:15%;top:10%;width:70%;height:80%;background:#1c2530;border:1px solid #627080;border-radius:20px;padding:45px;overflow:hidden}
.modal-top{height:100px}.modal h2{font-size:40px;margin:8px 0 0}.modal-overline{letter-spacing:2px;color:#b6c0cd}.close{position:absolute;right:40px;top:45px;color:#c6cbd2}
.module-list{height:65%;overflow:auto}.module{padding:18px 20px;margin-bottom:10px;border:2px solid transparent;background:#2b3441;font-size:25px}.module.active{border-color:white}.module small{display:block;font-size:15px;margin-top:5px;color:#abb5c2}.modal-note{font-size:16px;color:#c5cdd4}
/* Smaller viewports retain readable content without relying on JS scaling. */
@media(max-height:800px){h1{font-size:60px}.intro-area{margin-bottom:5vh}.tile-face{height:130px;width:134px}.tile{width:138px}.app-icon{width:68px;height:68px;left:32px;top:30px}.topbar{top:5%}}
</style>
</head>
<body>
<div id="stage">
  <div id="wallpaper" class="wallpaper"></div>
  <div id="wallpaper-next" class="wallpaper wallpaper-next"></div>
  <div id="weather-tint" class="weather-tint"></div>
  <div class="scrim"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-symbol">
        <svg class="brand-emblem" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs><linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#a8b0b8"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
          <path d="M14 43.5C22 24.5 43 10 57 18C69 25 63 43 50 55C40 64 27 69 20 61C10 49 23 36 36 32" fill="none" stroke="#eef0f2" stroke-width="6.4" stroke-linecap="round"/>
          <path d="M65 36C56 54 38 71 25 64C13 58 17 41 29 28C39 17 52 12 60 21" fill="none" stroke="#bfc8d1" stroke-width="3.6" stroke-linecap="round"/><circle cx="62" cy="18" r="3.1" fill="#fff"/>
        </svg>
      </span><span class="brand-name">Nymind <span class="brand-tv">TV</span></span>
    </div>
    <div class="now">
      <div class="datetime"><strong id="clock">--:--</strong><div id="date">—</div></div>
      <div class="weather" id="weather">
        <span class="weather-icon" id="weather-icon" aria-hidden="true"></span>
        <span class="weather-current"><strong id="weather-value"></strong><span id="weather-kind"></span>
          <div class="weather-place">Uherský Brod</div>
          <div class="weather-source"><a href="https://open-meteo.com/" tabindex="-1">Data: Open-Meteo</a></div>
        </span>
      </div>
    </div>
  </header>
  <main>
    <div class="intro-area"><div class="eyebrow"><span class="eyebrow-line"></span><span id="part">NOVÝ DEN</span></div><h1 id="greeting">Vítej doma.</h1><p class="subtitle" id="subtext">To, na co máš právě náladu.</p></div>
    <div class="dock-area"><div class="dock-label">TVŮJ VÝBĚR</div><section class="tiles" id="tiles" aria-label="Aplikace">
      <div class="tile active" data-kind="module" data-match="gh/romangazdik-web/StremioK" tabindex="0">
        <span class="tile-face"><svg class="app-icon" viewBox="0 0 82 82" xmlns="http://www.w3.org/2000/svg"><path d="M22 17L49 9L68 26L61 55L36 70L15 51Z" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".7"/><path d="M32 25L56 41L32 57Z" fill="currentColor"/></svg></span>
        <span class="tile-copy"><strong>StremioK</strong><small>Filmy a seriály</small></span>
      </div>
      <div class="tile" data-kind="module" data-match="gh/romangazdik-web/TizenTube-MojeTV" tabindex="0">
        <span class="tile-face"><svg class="app-icon" viewBox="0 0 82 82" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="22" width="58" height="39" rx="12" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M35 32L51 41L35 50Z" fill="currentColor"/></svg></span>
        <span class="tile-copy"><strong>TizenTube</strong><small>Videa bez reklam</small></span>
      </div>
    </section></div>
    <span id="status" class="screenreader-only" aria-live="polite">Načítám moduly…</span>
  </main>
  <div class="background-label"><strong>N Y M I N D &nbsp; / &nbsp; 0 1</strong><span id="wallpapername">Monochrome Edition</span></div>
</div>
<div id="overlay" class="overlay hidden"><div class="modal"><div class="modal-top"><div><span class="modal-overline">SPRÁVA APLIKACÍ</span><h2>Všechny moduly</h2></div><div class="close">Zpět = zavřít</div></div><div id="module-list" class="module-list"></div><p class="modal-note">Servisní nabídka TizenBrew</p></div></div>
<script src="app.js"></script>
<script>
/* VISUAL EDITION 1.3. ES5 only: no key handlers, no module navigation changes. */
(function () {
  'use strict';
  var blocks = [
    [6,8,'06','Dobré ráno.','Nový den, nové příběhy.','NOVÝ DEN'],
    [8,10,'08','Příjemné ráno.','Dopřej si chvíli jen pro sebe.','RANNÍ POHODA'],
    [10,12,'10','Krásné dopoledne.','Najdi něco, co tě vtáhne.','DOPOLEDNÍ SVĚTLO'],
    [12,14,'12','Pěkné poledne.','Na chvíli vypni svět okolo.','POLEDNÍ KLID'],
    [14,16,'14','Hezké odpoledne.','Dobrý příběh nikdy nepočká.','ODPOLEDNÍ RYTMUS'],
    [16,18,'16','Příjemný podvečer.','Teď už nikam nespěchej.','ZLATÁ HODINA'],
    [18,20,'18','Dobrý večer.','Pohodlně se usaď.','VEČERNÍ POHODA'],
    [20,22,'20','Dobrý večer.','Teď začíná tvůj čas.','VEČERNÍ KLID'],
    [22,6,'22','Klidnou noc.','Ještě jeden dobrý příběh?','NOČNÍ REŽIM']
  ];
  var currentBlock = -1;
  var fadeTimer = 0;
  var activeLoad = 0;
  var wallpaper = document.getElementById('wallpaper');
  var next = document.getElementById('wallpaper-next');

  function selectedBlock(hour) {
    var i, b;
    for (i=0; i<blocks.length; i++) {
      b=blocks[i];
      if (b[0]<b[1] && hour>=b[0] && hour<b[1]) return i;
      if (b[0]>b[1] && (hour>=b[0] || hour<b[1])) return i;
    }
    return 7;
  }

  function switchWallpaper(hour) {
    var idx=selectedBlock(hour);
    if (idx===currentBlock) return;
    currentBlock=idx;
    var item=blocks[idx];
    document.getElementById('greeting').textContent=item[3];
    document.getElementById('subtext').textContent=item[4];
    document.getElementById('part').textContent=item[5];

    /* Preload before fading, so a missing image never leaves a black screen. */
    var url='wallpapers/wallpaper-'+item[2]+'.jpg';
    var seq=++activeLoad;
    clearTimeout(fadeTimer);
    var img = new Image();
    img.onload=function () {
      if (seq!==activeLoad) return;
      next.style.backgroundImage='url("'+url+'")';
      next.style.opacity='0';
      /* Force previous opacity to be painted before changing to 1. */
      next.offsetWidth;
      next.style.opacity='1';
      fadeTimer=setTimeout(function () {
        if (seq!==activeLoad) return;
        wallpaper.style.backgroundImage='url("'+url+'")';
        next.style.opacity='0';
      },1450);
    };
    img.onerror=function () { /* Keep the already visible wallpaper. */ };
    img.src=url;
  }

  function weatherLabel(code,day) {
    if (code===0) return [day?'☼':'☾','Jasno'];
    if (code===1 || code===2) return ['◑', 'Polojasno'];
    if (code===3) return ['☁','Oblačno'];
    if (code===45 || code===48) return ['≋','Mlha'];
    if ((code>=51 && code<=67) || (code>=80 && code<=82)) return ['☂','Déšť'];
    if ((code>=71 && code<=77) || (code>=85 && code<=86)) return ['❄','Sněžení'];
    if (code>=95) return ['ϟ','Bouřka'];
    return ['○','Aktuálně'];
  }

  /* Color selection follows current WMO weather conditions, never a guessed forecast. */
  function applyWeatherTint(code, isDay) {
    var tint=document.getElementById('weather-tint');
    var color='#7897b7', opacity='0.10';
    if (code===0) { /* clear */
      color=isDay?'#f1b671':'#466d9b'; opacity=isDay?'0.11':'0.17';
    } else if (code===1 || code===2) { /* partly cloudy */
      color=isDay?'#d6c2a0':'#607b9d'; opacity='0.10';
    } else if (code===3) { /* overcast */
      color='#73879a'; opacity='0.14';
    } else if (code===45 || code===48) { /* fog */
      color='#b7b6b2'; opacity='0.13';
    } else if ((code>=51 && code<=67) || (code>=80 && code<=82)) { /* drizzle/rain */
      color='#3788aa'; opacity='0.17';
    } else if ((code>=71 && code<=77) || (code>=85 && code<=86)) { /* snow */
      color='#c5deeb'; opacity='0.17';
    } else if (code>=95 && code<=99) { /* thunder */
      color='#42567a'; opacity='0.22';
    }
    tint.style.backgroundColor=color;
    tint.style.opacity=opacity;
  }

  function hideWeather() {
    document.getElementById('weather').style.display='none';
    document.getElementById('weather-tint').style.opacity='0';
  }

  function fetchWeather() {
    var box=document.getElementById('weather');
    /* The forecast service supports CORS and does not need an API key for personal use. */
    var url='https://api.open-meteo.com/v1/forecast?latitude=49.0251&longitude=17.6472&current=temperature_2m,weather_code,is_day&timezone=Europe%2FPrague&forecast_days=1';
    var req;
    try {
      req=new XMLHttpRequest();
      req.open('GET', url, true);
      req.timeout=9000;
      req.onreadystatechange=function () {
        if (req.readyState!==4) return;
        if (req.status!==200) { hideWeather(); return; }
        try {
          var data=JSON.parse(req.responseText);
          var cur=data.current;
          if (!cur || typeof cur.temperature_2m!=='number' || typeof cur.weather_code!=='number') throw new Error('missing data');
          var state=weatherLabel(cur.weather_code,cur.is_day!==0);
          var temp=Math.round(cur.temperature_2m);
          applyWeatherTint(cur.weather_code,cur.is_day!==0);
          document.getElementById('weather-icon').textContent=state[0];
          document.getElementById('weather-value').textContent=temp+' °C';
          document.getElementById('weather-kind').textContent='  ·  '+state[1];
          box.style.display='block';
        } catch (ignored) { hideWeather(); }
      };
      req.onerror=function () { hideWeather(); };
      req.ontimeout=function () { hideWeather(); };
      req.send(null);
    } catch (ignored2) { hideWeather(); }
  }

  function updateDay() { switchWallpaper((new Date()).getHours()); }
  updateDay();
  fetchWeather();
  setInterval(updateDay, 30000);
  setInterval(fetchWeather, 30*60*1000);
  document.addEventListener('visibilitychange',function () {
    if (!document.hidden) { updateDay(); fetchWeather(); }
  }, false);
})();
</script>
</body>
</html>
